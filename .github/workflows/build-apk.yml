name: Build ARM64 APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
          cache: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository Actions secret: $name"
              exit 1
            fi
          done

      - name: Validate bundled scanner CIDRs
        working-directory: scanner
        run: go run ./cmd/normalize_scanner_cidrs --check ../assets/scanner

      - name: Build Psiphon ARM64 native library
        env:
          ANDROID_ABIS: arm64-v8a
        run: bash scripts/build_psiphon.sh

      - name: Fetch verified Tor and lyrebird ARM64 bundle
        env:
          ANDROID_ABIS: arm64-v8a
        run: bash scripts/fetch_tor.sh

      - name: Build Xray ARM64 Android library
        env:
          ANDROID_ABIS: arm64-v8a
        run: bash scripts/build_xray.sh

      - name: Free Go build cache
        run: |
          go clean -cache -modcache
          df -h /

      - name: Fetch routing data
        run: bash scripts/fetch_geo.sh

      - name: Build minified Cloudflare Worker asset
        working-directory: worker
        run: |
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          npm run minify

      - name: Fetch Tor bridges for the setup wizard
        run: bash scripts/fetch_tor_bridges.sh

      - name: Resolve Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Build ARM64 APK before personal signing
        env:
          ANDROID_ABIS: arm64-v8a
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          build_number=$((100000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"

          flutter build apk --release --target-platform android-arm64 \
            --build-number "$build_number" --no-pub

          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"

          abis="$(unzip -Z1 "$apk" \
            | awk -F/ '$1 == "lib" && NF >= 3 { print $2 }' \
            | sort -u | paste -sd, -)"
          if [[ "$abis" != "arm64-v8a" ]]; then
            echo "::error::Unexpected native ABIs in APK: $abis"
            exit 1
          fi

          mkdir -p dist

      - name: Sign and verify with the persistent personal key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          sign_dir="$RUNNER_TEMP/bpb-signing"
          mkdir -p "$sign_dir"
          cleanup() {
            rm -rf "$sign_dir"
          }
          trap cleanup EXIT

          keystore="$sign_dir/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"

          keytool -list -keystore "$keystore" -storetype JKS \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK path is missing}}"
          apksigner="$(find "$sdk/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"

          apk="dist/bpb-$VERSION-$BUILD_NUMBER-arm64-v8a.apk"
          "$apksigner" sign --ks "$keystore" --ks-type JKS \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "$apk" build/app/outputs/flutter-apk/app-release.apk

          signature_output="$("$apksigner" verify --verbose --print-certs "$apk")"
          printf '%s\n' "$signature_output" | tee dist/APK-SIGNATURE.txt

          expected_cert="$(keytool -list -v -keystore "$keystore" -storetype JKS \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
            | awk -F': ' '/SHA256:/{gsub(":","",$2); print tolower($2); exit}')"
          actual_cert="$(printf '%s\n' "$signature_output" \
            | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print tolower($2); exit}')"
          if [[ -z "$expected_cert" || "$expected_cert" != "$actual_cert" ]]; then
            echo "::error::APK certificate does not match the configured keystore"
            exit 1
          fi

          sha256sum "$apk" > dist/SHA256SUMS
          {
            echo "Version: $VERSION+$BUILD_NUMBER"
            echo "Commit: $GITHUB_SHA"
            echo "ABI: arm64-v8a"
            echo "Signing: persistent personal JKS; certificate fingerprint verified"
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > dist/BUILD-INFO.txt
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="bpb-v${VERSION}-build.${BUILD_NUMBER}"

          gh release create "$tag" \
            "dist/bpb-${VERSION}-${BUILD_NUMBER}-arm64-v8a.apk" \
            dist/SHA256SUMS \
            dist/BUILD-INFO.txt \
            dist/APK-SIGNATURE.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "BPB VPN ${VERSION} (build ${BUILD_NUMBER})" \
            --notes "Single-ABI Android arm64-v8a build from commit $GITHUB_SHA. Download the APK asset directly; APK signature fingerprint is in APK-SIGNATURE.txt and SHA256SUMS verifies the file." \
            --prerelease
